name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  REBAR3_VERSION: '3.27.0'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        otp-version: ['27.0', '28.0', '29.0']

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1.24.0
        with:
          otp-version: ${{ matrix.otp-version }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - uses: actions/cache@v4
        id: rebar3-cache
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.otp-version }}-${{ env.REBAR3_VERSION }}-${{ hashFiles('rebar.config', 'rebar.lock') }}

      - run: rebar3 check

      - run: rebar3 test

      - uses: test-summary/action@v2
        if: always()
        with:
          paths: '_build/test/logs/**/report.xml'
